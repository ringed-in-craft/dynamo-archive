artifacts = ["/app/output/report.csv", "/app/output/generate_report.py"]

[task]
name = "dynamo/reporting-pipeline-fix"
description = "Fix grain bugs, a missing filter, and a query-plan anti-pattern in a quarterly financial reporting pipeline"

[metadata]
# --- Pre-seeded — DO NOT EDIT ---
category = "Data Querying and Databases"
subcategory = "Query optimization"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["fix"]
artifact_type = ["single_script_or_program", "generated_output_artifact"]
expert_time_estimate_hours = 2
difficulty_explanation = """The agent inherits a Python reporting pipeline that produces silently wrong financial output. Four independent bugs span different SQL classes: two are visible on the sample data (grain fan-out multiplying per-order discounts across line items, and shipping summed at line-item instead of order level), while two are hidden — the sample database contains zero excluded-status orders so a missing filter produces correct output on sample but wrong output on the held-out database (15% excluded), and the sample has shipping for every order so an INNER JOIN silently drops unshipped orders only on the held-out data (15% without shipping). The visible bugs act as a lure: fixing them makes output look correct, so the agent stops before discovering the hidden bugs. A senior analytics engineer would need 2-3 hours to find all four issues."""
solution_explanation = """Fix 1: Pre-aggregate order-level discounts in a subquery before joining with order_items. Fix 2: Pre-aggregate shipping costs per order in a subquery before combining with line-item data. Fix 3: Add WHERE order_status IN ('completed', 'pending'). Fix 4: Change INNER JOIN shipping to LEFT JOIN so orders without shipping records are included with 0 shipping cost."""
verification_explanation = """The verifier replaces the sample database with a held-out version (same schema, different seed, 500 orders with 15% excluded statuses and 15% without shipping) and runs the agent's fixed script. It checks the CSV matches the golden reference exactly — float values to 2 decimal places, cell-by-cell, columns [year, quarter, total_orders, total_revenue, total_discount, total_shipping]. Zero-item orders contribute 0 discount and 0 shipping. The verifier copies golden data to a tmp_path before comparison."""

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
