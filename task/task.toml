artifacts = ["/app/output/decoded.json", "/app/output/sensorlog"]

[task]
name = "dynamo/sensorlog-decoder-fix"
description = "Reverse engineer a stripped binary decoder and write a Python equivalent"

[metadata]
category = "Security"
subcategory = "Reverse Engineering"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["single_script_or_program", "generated_output_artifact"]
expert_time_estimate_hours = 3
difficulty_explanation = """The agent is given a stripped, optimized ELF binary that decodes a custom binary log format into JSON. They must reverse-engineer the binary — using objdump, strings, strace, and test runs — to understand the file format (magic bytes, block headers, per-record structures with timestamps, sensor IDs, and floating-point values) and write a Python script that produces byte-identical output on any valid input. The format uses little-endian integers, 32-bit floats, and a fixed 256-record block structure where each block begins with a 4-byte base timestamp and individual records carry a 1-byte relative offset. The agent must discover all of this from a stripped binary with no source code, no symbols, and no format documentation — genuine reverse engineering. A senior security engineer would need 2-4 hours to reverse-engineer the binary, identify all fields, and write a correct Python decoder. The data is author-generated synthetic binary data."""
solution_explanation = """Run the binary on the sample file to observe output format. Use objdump -d to disassemble and identify the parsing loop: 4-byte magic check, 2-byte block_size read, then a loop reading 4-byte block headers followed by 256 6-byte records. Each record: byte 0 = relative offset, byte 1 = sensor ID, bytes 2-5 = float. The timestamp is base_timestamp + offset. Write a Python script using struct.unpack with format '<H' for block_size, '<I' for base timestamp, unpack bytes 0-1 as unsigned chars and bytes 2-5 as float."""
verification_explanation = """The verifier removes the reference binary from the environment, copies the held-out file into place, and runs the agent's script. The output JSON is compared record-by-record against a pre-computed golden reference (stored only in tests/) — timestamp, sensor_id, and value must all match exactly."""

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
