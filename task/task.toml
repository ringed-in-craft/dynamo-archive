difficulty_explanation = """The agent must reconstruct a lost mathematical function — expression tree canonicalization coupled with a 64-bit signature accumulator — from 20 input-output pairs alone. No specification or source code survives. The work requires the skill of a CAS developer or computational mathematician who understands expression tree parsing, algebraic normalization (term ordering, GCD factoring, sign normalization), and accumulator-based digest functions. The data is author-generated synthetic polynomial expressions. The 20 sample pairs include 12 expressions with small coefficients (1–100) establishing the linear component, and 8 expressions with coefficients spanning 2^24 to 2^40 (~16 million to ~1 trillion) that exercise the non-linear mixing path with spike values ranging from 1 to over 65,000 — sufficient breadth to uniquely constrain the 64-bit XOR constant C_NL. Two of these are 3-term expressions, ensuring all three rotation slots (indexed by term position modulo 3) are observable. The sample set also includes a parenthesized expansion ((x+1)^2) demonstrating that expressions are fully expanded during canonicalization, and an x^0 term demonstrating the convention that zero-exponent variables are retained as terms rather than simplified to constants. The reconstruction challenge is isolating: (1) canonicalization rules; (2) linear accumulator weights c * ord(var) * C_VAR + exp * C_EXP from small-coeff samples; (3) from large-coeff samples: the non-linear threshold (2^24), the spike extraction rule ((|c| >> 24) & 0xFFFFFFFFFF), the XOR constant C_NL, and the three rotation amounts. The held-out expressions further test with larger coefficients (10^9–10^12) and edge cases. This is the kind of work a symbolic computation developer at Wolfram, Maplesoft, or the SymPy project would perform when reverse-engineering an undocumented internal representation for compatibility."""
solution_explanation = """The key insight is that the signature function separates into two layers: canonicalization and accumulation. The canonicalization rules are inferred first by comparing expression pairs: x^2*y and y*x^2 produce the same signature, revealing lexicographic term ordering with a > b > ... > z; (x+1)^2 expands to x^2+2*x+1 before signature computation; x^0+y retains the zero-exponent variable term (not simplified to constant); 2*x+3 and -(2*x+3) produce different signatures due to sign normalization via GCD factoring. Once the canonical form is determined, the accumulator is isolated: the 12 small-coefficient samples provide enough linear equations to fit the per-variable-exponent weights c * ord(var) * C_VAR + exp * C_EXP. The 8 large-coefficient samples (spanning 2^24 to 2^40) then reveal the non-linear mechanics: the threshold (2^24, identifiable from which samples deviate from linear prediction), the spike extraction rule ((|c| >> 24) & 0xFFFFFFFFFF, identifiable from how different coefficient magnitudes produce different deviation magnitudes), the XOR constant C_NL (solvable from 8 samples with spike values spanning 1 to over 65,000), and the three rotation amounts (all three observable from the two 3-term samples). A focused domain expert familiar with tree algorithms and accumulator design can isolate all components in approximately 4 hours."""
verification_explanation = """The verifier runs five test functions. test_module_exists_and_callable confirms /app/fingerprint.py exists, imports cleanly, and exposes a callable fingerprint that returns a 64-bit integer for valid input. test_all_sample_pairs loads the 20 archived pairs from /app/data/samples.jsonl and asserts exact signature match for each — no tolerances. test_all_heldout_pairs loads the 30 hidden held-out pairs from /tests/expected/heldout.jsonl (available only at verify time, never during the agent run) and asserts exact match. test_purity enforces anti-cheat constraints: fingerprint.py size <= 50 KB, no base64-encoded data or binary headers (ELF, ZIP, PNG), no non-stdlib imports. test_no_embedded_tables detects large precomputed data structures. All tests use exact equality comparison — no tolerances, no ranges, no partial credit. The held-out expressions are never accessible to the agent, and the fingerprint.py module must compute every signature algorithmically from the expression string argument alone."""

