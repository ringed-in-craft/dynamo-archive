artifacts = ["/app/output/recover.py"]

[task]
name = "dynamo/chnk-archive-recovery"
description = "Fix a CHNK archive recovery tool that parses a custom chunked format incorrectly and uses the wrong checksum algorithm to validate redundant chunk copies"

[metadata]
category = "File and Media Operations"
subcategory = "Recovery and repair"
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
task_objective = ["fix", "recover_or_repair_artifact"]
artifact_type = ["single_script_or_program", "archive_or_compressed_artifact"]
expert_time_estimate_hours = 3
difficulty_explanation = """The agent receives a partially-working chunked-archive recovery tool and the format specification. The tool has two defects: it reads data_size in big-endian order instead of the spec-mandated little-endian, and it validates chunk copies using Python's zlib.crc32 instead of the archive's custom prime-weighted checksum. On the sample archive, the endianness bug is subtle (small values differ visibly), and crc32 coincidentally selects the correct copies because the sample has copy A always correct and the buggy fallback picks A. The held-out archive has chunks where copy A is corrupted and copy B is correct — a tool still using the broken fallback selects corrupted data and produces wrong output. The custom checksum formula (prime-weighted rolling sum with seed) is not CRC32, Adler-32, Fletcher, or any standard algorithm; it cannot be looked up online and must be reconstructed mathematically from the stored checksum values and chunk data present in the sample archive. A senior systems engineer would need 3 hours to diagnose the endianness bug and reverse-engineer the checksum from known chunk data."""
solution_explanation = """Fix 1: Change data_size parsing from big-endian (">I") to little-endian ("<I") as specified in FORMAT.md. Fix 2: Replace zlib.crc32 with the custom checksum formula. The checksum is recoverable because the sample archive provides chunk data bytes and their stored checksum values. The formula is sum(byte_i * prime[i mod 8]) + 0x9E3779B9 mod 2^32, where primes = [2,3,5,7,11,13,17,19]. With 8+ chunks of different lengths, the coefficients form a linear system solvable by Gaussian elimination over integers mod 2^32. An expert would recognize the linear structure (each chunk provides one equation per byte offset contributing to the same prime coefficient) and solve for the 8 unknowns."""
verification_explanation = """The verifier replaces the sample archive with a held-out archive containing different files and chunk corruption patterns. In the held-out archive, several chunks have copy A corrupted and copy B correct — the exact inverse of the sample. The agent's fixed script must select copy B for those chunks (using the correct checksum) to produce byte-identical output. The verifier checks SHA-256 of each recovered file against a pre-computed golden reference stored only in tests/expected/. A tool still using crc32 or the copy-A fallback produces wrong bytes and fails SHA-256. A tool that disables validation entirely and hardcodes one copy also fails because neither copy-A-only nor copy-B-only is consistently correct. The checksum formula is genuinely load-bearing: only implementing the exact custom formula selects the correct copy for every chunk."""

