[task]
name = "dynamo/sparse-transform-recovery"
description = "Reconstruct a lost banded-matrix transform with non-linear encoding from archived input-output vector pairs"

[metadata]
category = "Mathematics and Formal Reasoning"
subcategory = "Computational Linear algebra"
model_tested = "Opus-4.8"
