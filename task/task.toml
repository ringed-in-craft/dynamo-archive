difficulty_explanation = """The agent must reconstruct a lost mathematical function — expression tree canonicalization coupled with a 64-bit signature accumulator — from 20 input-output pairs alone. No specification, source code, or documentation survives. The work requires the skill of a CAS developer or computational mathematician who understands expression tree parsing, algebraic normalization (term ordering, GCD factoring, sign normalization), and accumulator-based digest functions. The data is author-generated synthetic polynomial expressions with realistic coefficient distributions. The 20 sample pairs include 16 expressions with small coefficients (1–100) and 2 expressions with coefficients exceeding 2^24 (~16.7 million), sufficient to observe the threshold-gated non-linear mixing path. The reconstruction challenge is isolating: (1) the canonicalization rules — term ordering by variable priority, GCD factoring with sign normalization, exponent flattening (x^1→x, x^0 omitted), subtraction-to-addition conversion; (2) the linear accumulator weights C_VAR * ord(var) + C_EXP * exp for each variable-exponent pair; (3) the non-linear threshold (2^24), the spike extraction rule (top 40 bits via >> 24), the hidden mixing constant C_NL, and the rotation amounts [7, 13, 17] cycled by term position modulo 3. An agent that fits only the linear component from the 18 small-coefficient samples will fail on the 2 large-coefficient samples, signaling that non-linearity exists — the task tests whether the agent can then isolate the threshold, the spike extraction rule, and the rotation schedule from those 2 samples plus held-out behavior. The dual reconstruction — canonicalization rules AND accumulator — means the agent cannot solve one without the other; wrong canonicalization produces wrong tree structures which produce wrong signatures regardless of accumulator fidelity. This is the kind of work a symbolic computation developer at Wolfram, Maplesoft, or the SymPy project would perform when reverse-engineering an undocumented internal representation for compatibility."""
solution_explanation = """The key insight is that the signature function separates into two layers: canonicalization and accumulation. The canonicalization rules are inferred first by comparing expression pairs: x^2*y and y*x^2 produce the same signature, revealing lexicographic term ordering with a > b > ... > z; 3*x + 2*x and 5*x produce different signatures, confirming constant folding is NOT applied (only like terms are grouped, not combined arithmetically); 2*x + 3 and -(2*x + 3) produce different signatures, confirming sign normalization via GCD factoring; x^1 and x produce identical trees, confirming exponent-1 flattening. Once the canonical form is determined, the accumulator is isolated: single-variable expression pairs with different coefficients reveal the per-variable linear weight; multi-variable terms confirm additivity of per-variable contributions; the constant term reveals the bias. Two sample pairs include coefficients >= 2^24, demonstrating non-linear behavior — comparing these to small-coefficient counterparts isolates the threshold (2^24), the spike extraction rule (top 40 bits via >> 24), the hidden XOR constant C_NL, and the rotation amounts [7, 13, 17] cycled by term position modulo 3. The linear weights C_VAR * ord(var) + C_EXP * exp are fit from the 18 small-coefficient samples; the non-linear component is isolated from the 2 large-coefficient samples. The 30 held-out expressions use coefficient magnitudes in the 10^9–10^12 range to ensure thorough exercise of both paths. A focused domain expert familiar with tree algorithms and accumulator design can isolate all components in approximately 4 hours."""
verification_explanation = """The verifier runs four test functions. test_module_exists_and_callable confirms /app/fingerprint.py exists, imports cleanly, and exposes a callable fingerprint that returns a 64-bit integer for valid input. test_all_sample_pairs loads the 20 archived pairs from /app/data/samples.jsonl and asserts exact signature match for each — no tolerances. test_all_heldout_pairs loads the 30 hidden held-out pairs from /tests/expected/heldout.jsonl (available only at verify time, never during the agent run) and asserts exact match. test_purity enforces anti-cheat constraints: fingerprint.py size <= 50 KB, no base64-encoded data or binary headers (ELF, ZIP, PNG), no non-stdlib imports. test_no_embedded_tables detects large precomputed data structures. All tests use exact equality comparison — no tolerances, no ranges, no partial credit. The held-out expressions are never accessible to the agent, and the fingerprint.py module must compute every signature algorithmically from the expression string argument alone."""

