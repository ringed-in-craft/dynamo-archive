artifacts = ["/app/output/decoded.json", "/app/output/sensorlog"]

[task]
name = "dynamo/sensorlog-decoder-fix"
description = "Reverse engineer a stripped binary decoder and write a Python equivalent"

[metadata]
category = "Security"
subcategory = "Reverse Engineering"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["single_script_or_program", "generated_output_artifact"]
expert_time_estimate_hours = 3
difficulty_explanation = """The agent is given a binary sensor log file and its correct decoded JSON output. They must reverse-engineer the binary format — discovering magic bytes, 256-record block structure, 4-byte block headers containing base timestamps, and 6-byte records with offset/sensor ID/float fields — and write a Python decoder that works on any valid file. There is no reference implementation, no format documentation, and no source code. The agent must infer the format entirely from input-output pairs: examining raw bytes with hex dumps, trying struct format strings, validating against expected output, and iterating. The sample uses contiguous monotonic blocks where simpler interpretations might appear correct; the held-out data has temporal gaps and out-of-order blocks that expose incorrect format assumptions. This is genuine binary reverse engineering — the kind of work done in malware analysis, file format recovery, and forensic tool development. A senior reverse engineer would need 2-3 hours. Data is author-generated synthetic."""
solution_explanation = """Run the binary on the sample file to observe output format. Use objdump -d to disassemble and identify the parsing loop: 4-byte magic check, 2-byte block_size read, then a loop reading 4-byte block headers followed by 256 6-byte records. Each record: byte 0 = relative offset, byte 1 = sensor ID, bytes 2-5 = float. The timestamp is base_timestamp + offset. Write a Python script using struct.unpack with format '<H' for block_size, '<I' for base timestamp, unpack bytes 0-1 as unsigned chars and bytes 2-5 as float."""
verification_explanation = """The verifier removes the reference binary from the environment, copies the held-out file into place, and runs the agent's script. The output JSON is compared record-by-record against a pre-computed golden reference (stored only in tests/) — timestamp, sensor_id, and value must all match exactly."""

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
