artifacts = ["/app/output/solution.py"]

[task]
name = "dynamo/xform-reverse-engineer"
description = "Reverse-engineer a stripped ELF binary implementing a custom stream cipher and reimplement its transform function in pure Python"

[metadata]
category = "Security"
subcategory = "Exploit and CTF tasks"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["single_script_or_program"]
expert_time_estimate_hours = 3
difficulty_explanation = """The agent is given a stripped -O2-compiled ELF binary and three sample input/output pairs. The binary implements a length-dependent transform: for inputs ≤ 16 bytes, a simple XOR-with-rotating-state; for inputs > 16 bytes, a full non-linear stream cipher with custom xorshift-like mixing (shifts 9, 14, 6), additive constant, and CFB-style input feedback. All three sample inputs are ≤ 16 bytes, so only the short path is exercised by the samples. The binary's disassembly contains both code paths joined by a conditional branch. Models will disassemble the binary, identify the short-path transform, implement it, validate against the samples (which all pass), and ship — never discovering the long-path behavior that the held-out vectors exercise. Discovering the long path requires either testing with a >16-byte input or recognizing that the disassembly contains unreached code. Both require active exploration beyond sample-validation. Data is author-generated synthetic test vectors. A senior reverse engineer would need 2-3 hours to trace both code paths and implement correctly."""
solution_explanation = """The binary has two code paths joined by a length check (cmp $0x10 / ja). Short path (≤16 bytes): XOR each byte with the low byte of a 32-bit state, then update state via left-rotate-7 + add 0x9E3779B9. Long path (>16 bytes): full 128-bit stream cipher. The long path init loads four 32-bit constants (0x49445473, 0x0a4e2902, 0x9341ca26, 0x3702a9e6 — compiler-shuffled ordering determined by matching output). The mixing round uses custom shifts (shl 9, shr 14 on s[0], shr 6 on s[3]), a state rotation s[0]->s[1]->s[2]->s[3], additive constant (sub $0x61c88647 = add $0x9E3779B9), and CFB-style input feedback (XOR input word into new s[3] after saving keystream). The long path processes 4-byte chunks identically to v2. An expert would use objdump -d, identify the conditional branch, trace both paths, extract constants from immediates, and verify against samples (short path) and self-generated long test inputs (long path)."""
verification_explanation = """The verifier removes /app/xform from the filesystem, imports the agent's solution.py, and runs transform() against 18 held-out test vectors stored in tests/expected/. The held-out vectors cover: odd-length inputs exercising the tail path (1,2,3,5,6,7,9,15 bytes), byte-value stress (null bytes, 0xFF, alternating, binary range), length stress (1 KB, 4 KB), empty input, and random binary inputs of varying lengths. Expected outputs are precomputed at task build time from the reference binary and stored as golden.json. The verifier compares byte-exact — any deviation, even one byte, fails. The binary is removed before solution.py is imported, so any attempt to shell out or read /app/xform fails. There is no partial credit: all 18 vectors must match exactly. A model using standard xorshift128 shifts (11,8,19) produces wrong output on every vector. A model missing the additive constant or tail scheme produces wrong output on specific vector subsets. Only a faithful reimplementation passes."""

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
