artifacts = ["/app/output/report.csv", "/app/output/generate_report.py"]

[task]
name = "dynamo/reporting-pipeline-fix"
description = "Fix grain bugs, a missing filter, and a query-plan anti-pattern in a quarterly financial reporting pipeline"

[metadata]
# --- Pre-seeded — DO NOT EDIT ---
category = "Data Querying and Databases"
subcategory = "Query optimization"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["fix"]
artifact_type = ["single_script_or_program", "generated_output_artifact"]
expert_time_estimate_hours = 2
difficulty_explanation = """The agent is given a buggy reporting script and an authoritative specification document (REPORT_SPEC.md). The script has two visible bugs (grain fan-out causing inflated discounts and shipping) and fails to implement two hidden spec requirements. The hidden requirements only matter on held-out data: the discount is capped at 20% (MIN(discount_pct, 0.20) * subtotal), and shipping must use LEFT JOIN because some orders lack shipping records. The sample database is designed so the cap never triggers (all discounts <=20%) and all orders have shipping — so an agent who fixes the visible bugs and skips the spec's fine print produces correct output on sample but wrong output on the held-out database. This is a real-world pattern: production bugs where the spec says one thing but test data is homogeneous. A senior engineer would need 2-3 hours to read the spec thoroughly and implement all requirements."""
solution_explanation = """Fix 1: Pre-aggregate order-level discounts and shipping in subqueries before joining. Fix 2: Implement discount cap as MIN(discount_pct, 0.20) * subtotal. Fix 3: Use LEFT JOIN for shipping so orders without shipping records are included with 0 cost. Fix 4: Format all monetary values with exactly 2 decimal places. The key insight: the spec's discount cap and LEFT JOIN requirements only become visible when tested against data with high discount rates and missing shipping records."""
verification_explanation = """The verifier replaces the sample database with a held-out version (same schema, different seed, 500 orders with discounts up to 25% and 15% without shipping records) and runs the agent's fixed script. It checks the CSV matches the golden reference exactly — float values to 2 decimal places, cell-by-cell. The verifier copies golden data to a tmp_path before comparison."""

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
