difficulty_explanation = """The agent must reconstruct a lost mathematical function — expression tree canonicalization coupled with a 64-bit signature accumulator — from 20 input-output pairs alone. No specification, source code, or documentation survives. The work requires the skill of a CAS developer or computational mathematician who understands expression tree parsing, algebraic normalization (term ordering, GCD factoring, sign normalization), and accumulator-based digest functions. The data is author-generated synthetic polynomial expressions with realistic coefficient distributions. The 20 sample pairs include 14 expressions with small coefficients (1–100) establishing the linear component, and 6 expressions with coefficients exceeding 2^24 (~16.7 million) that exercise the non-linear mixing path. Two of these large-coefficient samples have 3 terms each, ensuring all three rotation slots (indexed by term position modulo 3) are observable. The reconstruction challenge is isolating: (1) the canonicalization rules — term ordering by variable priority, GCD factoring with sign normalization, exponent flattening (x^1→x, x^0 omitted), subtraction-to-addition conversion; (2) the linear accumulator weights C_VAR * ord(var) + C_EXP * exp from the 14 small-coefficient samples; (3) from the 6 large-coefficient samples: the non-linear threshold (2^24), the spike extraction rule (top 40 bits via >> 24), the hidden XOR constant C_NL, and the three rotation amounts [7, 13, 17]. The 6 large-coefficient samples provide enough variation in spike values and term positions to uniquely constrain all non-linear parameters. The held-out expressions further test the reconstruction with larger coefficients (10^9–10^12) and edge cases (zero, unary minus, exponent 0/1, GCD-identical pairs). The dual reconstruction — canonicalization rules AND accumulator — means the agent cannot solve one without the other; wrong canonicalization produces wrong tree structures producing wrong signatures regardless of accumulator fidelity. This is the kind of work a symbolic computation developer at Wolfram, Maplesoft, or the SymPy project would perform when reverse-engineering an undocumented internal representation for compatibility."""
solution_explanation = """The key insight is that the signature function separates into two layers: canonicalization and accumulation. The canonicalization rules are inferred first by comparing expression pairs: x^2*y and y*x^2 produce the same signature, revealing lexicographic term ordering with a > b > ... > z; 3*x + 2*x and 5*x produce different signatures, confirming constant folding is NOT applied (only like terms are grouped, not combined arithmetically); 2*x + 3 and -(2*x + 3) produce different signatures, confirming sign normalization via GCD factoring; x^1 and x produce identical trees, confirming exponent-1 flattening. Once the canonical form is determined, the accumulator is isolated: the 14 small-coefficient samples provide enough linear equations to fit the per-variable-exponent weights C_VAR * ord(var) + C_EXP * exp. The 6 large-coefficient samples then reveal the non-linear mechanics: the threshold (2^24, identifiable from which samples produce non-linear deviations), the spike extraction rule (top 40 bits via >> 24, identifiable from how different large coefficient values produce different deviation magnitudes), the XOR constant C_NL (solvable from the 6 samples with different spike values), and the three rotation amounts [7, 13, 17] (all three observable from the two 3-term large-coefficient samples). The held-out expressions use larger coefficients (10^9–10^12) and additional edge cases to ensure the reconstruction is thorough. A focused domain expert familiar with tree algorithms and accumulator design can isolate all components in approximately 4 hours."""
verification_explanation = """The verifier runs five test functions. test_module_exists_and_callable confirms /app/fingerprint.py exists, imports cleanly, and exposes a callable fingerprint that returns a 64-bit integer for valid input. test_all_sample_pairs loads the 20 archived pairs from /app/data/samples.jsonl and asserts exact signature match for each — no tolerances. test_all_heldout_pairs loads the 30 hidden held-out pairs from /tests/expected/heldout.jsonl (available only at verify time, never during the agent run) and asserts exact match. test_purity enforces anti-cheat constraints: fingerprint.py size <= 50 KB, no base64-encoded data or binary headers (ELF, ZIP, PNG), no non-stdlib imports. test_no_embedded_tables detects large precomputed data structures. All tests use exact equality comparison — no tolerances, no ranges, no partial credit. The held-out expressions are never accessible to the agent, and the fingerprint.py module must compute every signature algorithmically from the expression string argument alone."""

