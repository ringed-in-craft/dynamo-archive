artifacts = ["/app/build.sh"]

[task]
name = "dynamo/reproducible-release-tarball"
description = "Produce byte-reproducible release tarballs with a custom integrity marker from unclean source trees"

[metadata]
# --- Pre-seeded — DO NOT EDIT ---
category = "Build Dependency and Release Management"
subcategory = "Release Artifacts"
# --- Fixed for this dataset — leave as-is ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["build_or_package", "analyze"]
artifact_type = ["single_script_or_program", "archive_or_compressed_artifact"]
expert_time_estimate_hours = 4
difficulty_explanation = """This task requires dual expertise spanning release engineering and algorithmic reverse-engineering — the kind of cross-domain work performed by release engineers at organizations practicing SLSA or in-toto supply-chain attestation.

The first challenge is producing a deterministic .tar.gz archive from an unclean source tree. Seven independent nondeterminism sources must be controlled simultaneously: filesystem metadata (readdir sort order, mtimes including future dates requiring clamp-mtime, uid/gid and user/group names), archive format metadata (PAX headers embedding nanosecond timestamps, long paths silently switching format, extended attributes and ACLs), and compressor metadata (gzip mtime, original filename, OS byte). Fixing any subset produces a plausible-looking archive whose SHA-256 still differs from the reference by dozens of bytes. Additionally, step ordering matters — CRLF normalization must precede template substitution and permission normalization, or a version.txt.in with CRLF line endings produces wrong content and a bin/*.sh with CRLF endings misses its executable bit.

The second challenge is reconstructing the project's proprietary integrity marker algorithm from I/O pairs. The marker is a custom 32-bit dual-accumulator non-linear mixing function with xorshift, LCG multiplication, bit rotation, cross-accumulator feedback, and a final XOR mask — structurally unlike any published checksum or hash. No specification exists; the algorithm must be inferred by systematic probing: testing with empty input isolates initial state, single-byte inputs reveal additive and XOR operations, positioned multi-byte inputs expose shift and rotation amounts, and known marker pairs confirm the final mask. The sample provides only four file-to-marker pairs — enough surface when combined with oracle probing to uniquely determine all parameters, but insufficient for brute-force enumeration, which is infeasible due to the astronomical non-linear search space.

Data is author-generated synthetic constructed to mirror real conditions: mixed-case filenames exercising locale-dependent sort order, files with future mtimes, .git and editor droppings, non-canonical permissions, CRLF line endings, template files, deeply nested paths exceeding 100 characters, and extended attributes. The sample tree is deliberately simple — four ASCII files with uniform permissions — giving no hint of the edge cases in the hidden fixtures."""

solution_explanation = """The solution writes /app/build.sh as a self-contained bash or Python script accepting --source, --output, and --epoch.

Phase 1 — Staging: copy source to a staging directory applying the documented exclusion patterns (.git, node_modules, *.swp, *~, .DS_Store, ._*, __pycache__, .venv, *.pyc, Thumbs.db, .idea, .vscode, MANIFEST.sig). Then apply normalizations in order: (1) CRLF→LF using the documented name-match and null-byte heuristic, (2) template substitution replacing @EPOCH@ in version.txt.in with the raw epoch integer, (3) permission normalization to 0644/0755 with the documented bin/*.sh rule.

Phase 2 — Integrity marker: probe /app/marker with systematic inputs to isolate each component of the algorithm. Empty input reveals the combined initial state XORed with the final mask. Single-byte inputs 0x00 through 0xFF map the additive and XOR contributions. Positioned two-byte inputs (0x01 0x00, 0x00 0x01) reveal the xorshift amount (13 bits) and rotation amount (7 bits). Known marker pairs allow solving for the LCG multiplier (0x41C64E6D), increment (0x6073), and final XOR mask (0xA5A5A5A5). The algorithm is reimplemented within build.sh as pure computation over file contents.

Phase 3 — Archiving: generate MANIFEST.sig by computing markers for every file in the staging tree (sorted in C locale) and writing them in MARKER ./path format. Then create the tarball with LC_ALL=C tar --sort=name --mtime=@EPOCH --clamp-mtime --owner=0 --group=0 --numeric-owner --format=gnu --no-xattrs --no-acls --no-selinux piped through gzip -n -9.

The key insight is that the seven tar-determinism flags are individually documented in the Reproducible Builds literature but their interaction — particularly --clamp-mtime with --mtime, --format=gnu with long paths, and the independence of gzip -n from tar flags — must be understood holistically. For the marker, the insight is methodical component isolation rather than brute-force search."""

verification_explanation = """The verifier runs the agent's /app/build.sh against nine source trees: the two shipped examples (example/ and example_dirty/) and seven hidden fixtures, each targeting a distinct reproducibility trap (locale-dependent sort, future mtimes, exclusion patterns, permission normalization, CRLF + template, long paths, extended attributes). An attempt passes only if all nine SHA-256 values match the reference exactly — reproducibility is binary with no tolerance.

The verifier also runs structural probes on the example output: all entry mtimes equal the epoch, entries are sorted in C locale, all uid/gid are 0, gzip header has zeroed mtime and no embedded filename, no forbidden paths appear in the archive, and MANIFEST.sig is present with correct markers. The verifier independently recomputes expected markers for each fixture using the reference algorithm, confirming the agent's implementation is correct and not a lucky approximation.

Hidden fixture files are never accessible during the agent's development run, and /app/marker is absent at verification time, preventing hash hardcoding or lookup-table bypass. Multiple valid implementations are accepted as long as they produce byte-identical output to the reference GNU tar + gzip toolchain."""

