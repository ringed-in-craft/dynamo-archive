artifacts = ["/app/output/solution.py"]

[task]
name = "dynamo/xform-reverse-engineer"
description = "Reverse-engineer a stripped ELF binary implementing a custom stream cipher and reimplement its transform function in pure Python"

[metadata]
category = "Security"
subcategory = "Exploit and CTF tasks"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["binary_executable_or_library", "single_script_or_program"]
expert_time_estimate_hours = 3
difficulty_explanation = """The agent is given a stripped -O2-compiled ELF binary implementing a custom stream cipher and three sample input/output pairs. The binary must be reverse-engineered and reimplemented as a pure Python function. The transformation uses a 128-bit state with a non-linear mixing round combining custom xorshift-like operations (shift amounts 9, 14, 6 — not any published variant), an LCG-style additive constant (0x9E3779B9, visible in the binary as its two's complement subtraction), and a state-dependent tail scheme for inputs not divisible by 4 bytes. The sample inputs are all 4-byte-aligned ASCII, so the tail path is never exercised by the samples. Models will disassemble the binary, recognize xorshift-like patterns, attempt standard shift triples (11, 8, 19), and fail against the samples. Even if they extract the correct shift amounts from the disassembly, they must also handle the additive constant (encoded as subtraction) and the tail scheme that advances state once for 0-3 leftover bytes rather than per-byte. Data is author-generated synthetic test vectors. A senior reverse engineer or CTF competitor would need 3 hours of focused work with objdump/gdb to trace the register-level state machine and reimplement faithfully."""
solution_explanation = """The binary's algorithm is recoverable through disassembly: (1) The init state is four 32-bit constants loaded via mov-immediate instructions (0x49445473, 0x0a4e2902, 0x9341ca26, 0x3702a9e6 — note the compiler shuffles register allocation, so the ordering must be determined by matching output). (2) The mixing round (step function) shows shl 9, shr 14 on the first state word, shr 6 on the fourth, a state rotation s[0]->s[1]->s[2]->s[3], and a sub $0x61c88647 (equivalent to add $0x9E3779B9 mod 2^32). (3) The step function takes the input word as a parameter: it saves the keystream word before XOR feedback, then XORs the input word into the new s[3] value. This CFB-style feedback means the keystream depends on the input — a black-box keystream precomputation with null bytes produces wrong output. The disassembly shows the input word being loaded from memory and XOR'd into the state register after the additive constant step. (4) The main loop processes 4-byte chunks: construct a 32-bit word from 4 input bytes, call step(word) to get the keystream word, XOR each input byte with the corresponding keystream byte. (5) The tail handles 0-3 leftover bytes: zero-pad to 4 bytes, feed as a word to step(), use only the first r output bytes. An expert would use objdump -d to trace register flow, identify the feedback XOR, extract shift amounts and constants, and verify against the sample I/O pairs."""
verification_explanation = """The verifier removes /app/xform from the filesystem, imports the agent's solution.py, and runs transform() against 18 held-out test vectors stored in tests/expected/. The held-out vectors cover: odd-length inputs exercising the tail path (1,2,3,5,6,7,9,15 bytes), byte-value stress (null bytes, 0xFF, alternating, binary range), length stress (1 KB, 4 KB), empty input, and random binary inputs of varying lengths. Expected outputs are precomputed at task build time from the reference binary and stored as golden.json. The verifier compares byte-exact — any deviation, even one byte, fails. The binary is removed before solution.py is imported, so any attempt to shell out or read /app/xform fails. There is no partial credit: all 18 vectors must match exactly. A model using standard xorshift128 shifts (11,8,19) produces wrong output on every vector. A model missing the additive constant or tail scheme produces wrong output on specific vector subsets. Only a faithful reimplementation passes."""

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 2400.0

