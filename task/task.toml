artifacts = ["/app/output/decoded.json", "/app/output/sensorlog"]

[task]
name = "dynamo/sensorlog-decoder-fix"
description = "Fix a binary sensor log decoder that miscalculates timestamps across non-contiguous blocks"

[metadata]
category = "Security"
subcategory = "Reverse Engineering"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["fix", "debug", "analyze"]
artifact_type = ["single_script_or_program", "text_or_log_file", "generated_output_artifact"]
expert_time_estimate_hours = 2
difficulty_explanation = """The agent is given a Python script that decodes a custom binary log format into JSON. The script produces correct output on the provided sample file, so the agent has no visible failure signal. The bug: the script reads the first block's base timestamp once, then increments a running counter for every subsequent record, ignoring the per-block base timestamps embedded in the file. On the sample data (4 contiguous, monotonic blocks), this running counter produces correct timestamps. On the held-out data (blocks with temporal gaps and an out-of-order block), the counter diverges — timestamps are off by thousands to millions of seconds. Diagnosing this requires reverse-engineering the binary format: inspecting raw bytes with struct/hexdump, identifying the block structure, recognizing that each 256-record block begins with a 4-byte base timestamp, and understanding the relationship between block base and per-record relative offset. The agent cannot discover the bug by comparing output against a reference because the sample output is correct. A senior reverse engineer would need 2-3 hours to analyze the format, identify the timestamp mechanism, and fix the stateful counter."""
solution_explanation = """Read the per-block base timestamp from each block header (4 bytes, uint32 LE) using struct.unpack. For each record, compute the absolute timestamp as base_timestamp + offset (where offset is the first byte of the 6-byte record). Remove the stateful record_counter variable and the conditional that only reads the base on the first block."""
verification_explanation = """The verifier replaces sample.slog with a held-out version (4 blocks, same format, but with temporal gaps between blocks and one out-of-order block) and runs the agent's fixed /app/output/sensorlog. It checks: (1) exactly 1,024 records produced, (2) every record's timestamp matches the golden reference exactly. The held-out file has blocks at base timestamps 1000000000, 1000005000 (gap of 4744s), 999900000 (out-of-order, earlier), and 1000010000. The buggy running-counter would produce timestamps off by 4744s for block 1, over 100 million seconds for block 2, and thousands for block 3."""

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

